[project]
name = "hearth"
version = "0.1.0"
description = "Hearth — fully-local Apple-Silicon voice-conversation companion (engine)"
readme = "README.md"
requires-python = ">=3.12"
# Base deps are backend-neutral: the pipeline spine, control panel, session, serve
# facade — everything that does NOT bind a specific inference backend. TTS/STT
# backends arrive via the extras below.
dependencies = [
    "aiohttp>=3.14.1",
    "pipecat-ai[local,silero]>=1.4.0",
]
# NOTE: hearth.config.settings_registry uses pydantic v2, guaranteed transitively
# (pipecat-ai pins pydantic>=2.10.6,<3). Deliberately not declared above this
# stroke — uv.lock regeneration was out of scope; declare it explicitly at the
# next legitimate lock regeneration.

[project.optional-dependencies]
# mac — the Apple-Silicon MLX chain (TTS + STT). transformers==5.5.0 is pinned here
# because it is pulled SOLELY by the MLX chain: uv.lock shows transformers required
# only by mlx-audio and (transitively) mlx-lm; neither aiohttp nor pipecat pull it.
mac = [
    "mlx-audio>=0.4.4",
    "mlx-whisper>=0.4.3",
    "transformers==5.5.0",
]
# cuda — silver-tier / NVIDIA backend. Declared empty for now; its contents are a
# separate later decision (silver-tier is not scoped yet).
cuda = []
# memory-<backend> — adopted memory backends for the memory seam (hearth/memory/).
# Base install ships the seam + the zero-dependency compaction floor.
# hindsight: the extra installs ONLY the featherweight client SDK — the server
# (hindsight-all, ~1.4 GB closure) CANNOT share this venv (it needs protobuf>=7,
# pipecat pins protobuf<7) and runs as a sidecar from its own venv instead
# (mode="sidecar" in memory.toml; setup in docs/memory.md).
memory-hindsight = [
    "hindsight-client>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the package `hearth` lives under src/.
packages = ["src/hearth"]
